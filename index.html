```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapret Discord V3.15.5</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d12;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 430px;
            padding: 35px 25px;
            background: #151922;
            border: 1px solid #292f3b;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 50px #00000055;
        }

        h1 {
            margin: 0 0 25px;
            font-size: 27px;
            color: #8b9cff;
        }

        p {
            margin-bottom: 18px;
            color: #c4c9d4;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #343b49;
            border-radius: 9px;
            background: #0e1118;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #7185ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #4752c4;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #351b20;
            color: #ff7777;
        }

        .version {
            margin-top: 22px;
            color: #737c8d;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Zapret Discord V3.15.5</h1>

        <p>Введите конфиг чтоб скачать</p>

        <form id="configForm">
            <input
                type="text"
                id="config"
                placeholder="Введите конфиг..."
                autocomplete="off"
            >

            <button type="submit">Скачать</button>
        </form>

        <div id="message" role="alert">
            Неправильный конфиг
        </div>

        <div class="version">
            Zapret Discord • V3.15.5
        </div>
    </main>

    <script>
        const form = document.getElementById("configForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            message.textContent = "Неправильный конфиг";
            message.style.display = "block";
        });
    </script>
</body>
</html>
