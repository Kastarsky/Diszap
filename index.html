```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapret Discord V3.15.5</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0d12;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 430px;
    padding: 32px 25px;
    background: #151922;
    border: 1px solid #292f3b;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 15px 50px #00000055;
}

h1 {
    font-size: 26px;
    color: #8b9cff;
}

p {
    color: #c4c9d4;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 1px solid #343b49;
    border-radius: 8px;
    background: #0b0d12;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #7185ff;
}

.error {
    display: none;
    margin-top: 18px;
    padding: 12px;
    background: #351b20;
    color: #ff8585;
    border-radius: 8px;
}
</style>
</head>

<body>

<main class="container">

    <h1>Zapret Discord V3.15.5</h1>

    <p>Введите конфиг чтоб скачать</p>

    <input
        type="text"
        id="config"
        placeholder="Введите конфиг..."
        autocomplete="off"
        spellcheck="false"
    >

    <div id="error" class="error" role="alert">
        Версия не подходит
    </div>

</main>

<script>
const config = document.getElementById("config");
const error = document.getElementById("error");

config.addEventListener("input", () => {
    if (config.value.length > 0) {
        error.textContent = "Версия не подходит";
        error.style.display = "block";
    } else {
        error.style.display = "none";
    }
});
</script>

</body>
</html>
```
